    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #111;
        font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* Allow normal scrolling */
        -webkit-overflow-scrolling: touch;
        min-height: 100%;
      }

      #root {
        width: 100%;
        min-height: 100%;
      }
      
      /* Enable smooth scrolling for inner scrollable containers */
      .scrollable-content {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      .hide-until-mounted {
        opacity: 0;
        visibility: hidden;
      }

      html.app-mounted .hide-until-mounted {
        opacity: 1;
        visibility: visible;
        transition: opacity 180ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        html.app-mounted .hide-until-mounted {
          transition: none;
        }
      }

      /* Load splash: a blank white screen with the P mark and a grey ring around it,
         painted from the HTML itself so it covers the gap before the bundle runs.
         Removed from src/index.js on window load — the CSP is script-src 'self',
         so an inline script here would never execute. */
      #app-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        /* Mobile browsers lay a fixed element out against the large viewport (URL bar
           hidden) while the bar is still on screen, which drops the centre below the
           middle of what you can actually see and snaps it back once the bar settles.
           The dynamic units below track the visible viewport, so it starts centred. */
        height: 100%;
        z-index: 2147483647;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 300ms ease;
        /* Belt and braces: if the bundle never runs, don't strand anyone behind it.
           Sits past the bundle's own 20s cap so JS stays the one that clears it. */
        animation: splash-timeout 1ms linear 25s forwards;
      }

      @supports (height: 100dvh) {
        #app-splash {
          width: 100dvw;
          height: 100dvh;
        }
      }

      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Fixed-size box so the ring is centred on the mark by its own geometry rather
         than by where a browser chooses to put an abspos child of a flex container. */
      #app-splash .splash-box {
        position: relative;
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app-splash .splash-mark {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }

      #app-splash .splash-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border-radius: 50%;
        border: 3px solid #e6e6e6;
        border-top-color: #9a9a9a;
        animation: splash-spin 900ms linear infinite;
      }

      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes splash-timeout {
        to { opacity: 0; visibility: hidden; }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-ring {
          animation-duration: 2.4s;
        }
      }
    </style>
